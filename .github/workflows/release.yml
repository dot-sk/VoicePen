name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write
  id-token: write
  pages: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Release Package
    runs-on: macos-26
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Print toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Locate validated release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          expected_branch="release/${GITHUB_REF_NAME}"
          pull_request_number="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              | jq -r \
                --arg branch "$expected_branch" \
                --arg repository "$GITHUB_REPOSITORY" \
                --arg sha "$GITHUB_SHA" \
                '[.[] | select(
                  .state == "open"
                  and .base.ref == "main"
                  and .head.ref == $branch
                  and .head.sha == $sha
                  and .head.repo.full_name == $repository
                )][0].number // empty'
          )"

          if [[ -z "$pull_request_number" ]]; then
            echo "No open release pull request found for ${expected_branch} at ${GITHUB_SHA}." >&2
            exit 1
          fi

          run_id="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f event=pull_request \
              -f head_sha="$GITHUB_SHA" \
              -f status=success \
              -f per_page=20 \
              | jq -r \
                --arg branch "$expected_branch" \
                --arg sha "$GITHUB_SHA" \
                '[.workflow_runs[] | select(
                  .conclusion == "success"
                  and .event == "pull_request"
                  and .head_branch == $branch
                  and .head_sha == $sha
                )][0].id // empty'
          )"

          if [[ -z "$run_id" ]]; then
            echo "No successful release CI run found for ${GITHUB_SHA}." >&2
            exit 1
          fi

          candidate_name="VoicePen-release-candidate-${GITHUB_SHA}"
          artifact_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
              | jq -r \
                --arg name "$candidate_name" \
                '[.artifacts[] | select(.name == $name and (.expired | not))][0].id // empty'
          )"

          if [[ -n "$artifact_id" ]]; then
            printf "found=true\n" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The validated candidate artifact is unavailable; rebuilding the same tested commit."
            printf "found=false\n" >> "$GITHUB_OUTPUT"
          fi
          printf "name=%s\n" "$candidate_name" >> "$GITHUB_OUTPUT"
          printf "run_id=%s\n" "$run_id" >> "$GITHUB_OUTPUT"

      - name: Download validated release candidate
        if: steps.candidate.outputs.found == 'true'
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.candidate.outputs.name }}
          path: /private/tmp/VoicePenReleaseCandidate
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.run_id }}

      - name: Validate release secrets
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          test -n "$MACOS_SIGNING_CERTIFICATE_BASE64"
          test -n "$MACOS_SIGNING_CERTIFICATE_PASSWORD"
          test -n "$MACOS_SIGNING_IDENTITY"

      - name: Import release signing certificate
        env:
          MACOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          certificate_path="$RUNNER_TEMP/voicepen-release-signing.p12"
          trusted_certificate_path="$RUNNER_TEMP/voicepen-release-signing.cer"
          keychain_path="$RUNNER_TEMP/voicepen-release-signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf "%s" "$MACOS_SIGNING_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security find-certificate -c "$MACOS_SIGNING_IDENTITY" -p "$keychain_path" > "$trusted_certificate_path"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$trusted_certificate_path"
          original_keychains="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain_path" $original_keychains
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Promote validated release candidate
        if: steps.candidate.outputs.found == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          build="$(
            grep -E '^[[:space:]]*CURRENT_PROJECT_VERSION = ' VoicePen.xcodeproj/project.pbxproj \
              | sed -E 's/.*CURRENT_PROJECT_VERSION = ([^;]+);/\1/' \
              | sort -u
          )"
          test "$(printf "%s\n" "$build" | sed '/^$/d' | wc -l | tr -d ' ')" = "1"

          scripts/promote-release-candidate.sh \
            /private/tmp/VoicePenReleaseCandidate/VoicePen-macOS-unsigned.zip \
            /private/tmp/VoicePenDerivedData/Package/VoicePen-macOS-unsigned.zip \
            "$version" \
            "$build" \
            "$MACOS_SIGNING_IDENTITY"

      - name: Build package when candidate artifact is unavailable
        if: steps.candidate.outputs.found != 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: make package CODESIGN_IDENTITY="$MACOS_SIGNING_IDENTITY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoicePen-macOS-unsigned
          path: /private/tmp/VoicePenDerivedData/Package/VoicePen-macOS-unsigned.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: /private/tmp/VoicePenDerivedData/Package/VoicePen-macOS-unsigned.zip
          prerelease: true

      - name: Generate Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p public
          archive="/private/tmp/VoicePenDerivedData/Package/VoicePen-macOS-unsigned.zip"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/VoicePen-macOS-unsigned.zip"
          scripts/generate-appcast.sh "$archive" "$download_url" public/appcast.xml

      - name: Upload GitHub Pages artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages appcast
        if: startsWith(github.ref, 'refs/tags/')
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Delete release signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/voicepen-release-signing.keychain-db" || true
